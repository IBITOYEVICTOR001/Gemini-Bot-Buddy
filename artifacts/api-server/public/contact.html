<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — Ladex AI</title>
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7938418309580788"
     crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ffffff; --text:#1a1a1f; --muted:#6b6b76; --accent:#5b5ff0; --border:#e7e7ea; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
  header { display:flex; align-items:center; gap:10px; padding:20px 24px; border-bottom:1px solid var(--border); }
  .mark { width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--accent),#8b8ef8); display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:14px; }
  header a { text-decoration:none; color:var(--text); font-weight:600; font-size:15px; }
  main { max-width:680px; margin:0 auto; padding:48px 24px 80px; }
  h1 { font-size:32px; letter-spacing:-0.02em; margin-bottom:8px; }
  p { color:var(--muted); font-size:15.5px; margin-bottom:16px; }
  .contact-card { border:1px solid var(--border); border-radius:14px; padding:20px; margin-top:20px; }
  .contact-card a { color:var(--accent); font-weight:600; text-decoration:none; }
  .nav-links { display:flex; gap:20px; margin:32px 0; font-size:13.5px; }
  .nav-links a { color:var(--accent); text-decoration:none; font-weight:600; }
  footer { text-align:center; padding:24px; color:var(--muted); font-size:12.5px; border-top:1px solid var(--border); }
</style>
</head>
<body>
  <header>
    <div class="mark">L</div>
    <a href="/">Ladex AI</a>
  </header>
  <main>
    <h1>Contact</h1>
    <p>Have a question, found a bug, or want to share feedback about Ladex AI? Reach out — we'd love to hear from you.</p>
    <div class="contact-card">
      <p style="margin-bottom:6px;"><strong style="color:var(--text);">Email</strong></p>
      <a href="mailto:victoribitoye70@gmail.com">victoribitoye70@gmail.com</a>
    </div>
    <div class="contact-card">
      <p style="margin-bottom:6px;"><strong style="color:var(--text);">Telegram</strong></p>
      <a href="https://t.me/LadexAIBot" target="_blank" rel="noopener">@LadexAIBot</a>
    </div>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/about.html">About</a>
      <a href="/privacy.html">Privacy Policy</a>
    </div>
  </main>
  <footer>&copy; 2026 Ladex AI. All rights reserved.</footer>
</body>
</html>
